    html[data-theme="dark"] {

      --primary-foreground: #eff6ff;
      --secondary: #172033;

      --accent: #172033;
      --accent-foreground: #f8fafc;
      --destructive: #ef4444;

      --sidebar: #0d1320;
      --sidebar-foreground: #e2e8f0;

      --sidebar-accent-foreground: #f8fafc;

      /* Unified Scrollbar Tokens (Dark) */
      --sb-thumb: rgba(148, 163, 184, 0.14);
      --sb-thumb-box-hover: rgba(148, 163, 184, 0.28);
      --sb-thumb-hover: rgba(148, 163, 184, 0.48);

    html, body, #app { height: 100%; overflow: hidden; }
    #app > * { height: 100%; }
    html, body { background: var(--background); color: var(--foreground); }
    body {
      font-family: var(--font);
      margin: 0;
    }

    /* 全局统一极简细胶囊滚动条（Linear / Cursor 风格：4px 视觉 + 8px 热区，悬停/拖动加深，双主题自适应） */
    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    *::-webkit-scrollbar-button {
      display: none;
      width: 0;
      height: 0;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-corner {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background-color: var(--sb-thumb);
      border-radius: 999px;
      border: 2px solid transparent;
      background-clip: content-box;
      min-height: 28px;
      min-width: 28px;
    }
    *:hover::-webkit-scrollbar-thumb {
      background-color: var(--sb-thumb-box-hover);
    }
    *::-webkit-scrollbar-thumb:hover {
      background-color: var(--sb-thumb-hover);
      border-width: 1.5px;
    }
    *::-webkit-scrollbar-thumb:active {
      background-color: var(--sb-thumb-active);
      border-width: 1.5px;
    }
    @supports not selector(::-webkit-scrollbar) {
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--sb-thumb-box-hover) transparent;
      }
    }

    .shell { display: flex; height: 100%; min-width: 0; }
    .sider {
      width: var(--sidebar-w); flex: none;
      background: var(--sidebar); color: var(--sidebar-foreground);
      border-right: 1px solid var(--sidebar-border);
      display: flex; flex-direction: column;
      padding: 12px 10px;
    }
    .nav { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .nav-switch {
      position: relative; display: flex; flex-direction: column; gap: 8px;
    }
    .slide-pill {
      position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none;
      border-radius: var(--radius); background: #1e3a8a;
      transition:
        transform var(--aui-spring-selection),
        width var(--aui-spring-selection),
        height var(--aui-spring-selection),
        opacity var(--aui-fade);
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      border: 0; background: transparent; color: var(--sidebar-foreground);
      text-align: left; padding: 12px 14px; min-height: 44px;
      border-radius: var(--radius);
      cursor: pointer; font-size: 14px; line-height: 1.4;
      flex: none;
    }
    .nav-switch .slide-pill { background: #dbeafe; }
    .nav-switch .nav-item { position: relative; z-index: 1; }
    .nav-switch .nav-item.on,
    .nav-switch .nav-item.on:hover {
      background: transparent; color: #1e3a8a; font-weight: 500;
    }
    .nav-history { display: none; }
    .sider.sider-hist { padding: 8px 8px 0; }
    .hist-manage-pane {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .hist-manage-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 4px 8px 8px;
    }
    .hist-manage-title {
      font-size: 16px; font-weight: 600; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hist {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      margin-top: 4px; padding-top: 8px;
      border-top: 1px solid var(--sidebar-border);
    }
    .hist-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 0 6px 6px 14px;
    }
    .hist-head-label { font-size: 12px; color: var(--muted-foreground); font-weight: 500; line-height: 1.4; }
    .hist-head-actions { display: flex; align-items: center; gap: 4px; }
    .hist-tool, .hist-manage {
      border: 0; background: transparent; color: var(--muted-foreground);
      cursor: pointer; border-radius: var(--radius);
    }
    .hist-tool {
      width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    }
    .hist-tool .nav-ico { width: 15px; height: 15px; }
    .hist-manage { font-size: 12px; padding: 4px 8px; }
    .hist-tool:hover, .hist-manage:hover { background: var(--sidebar-accent); color: var(--foreground); }
    .hist-manage:disabled { opacity: .4; cursor: default; background: transparent; }
    .hist-scroll {
      flex: 1; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .hist-empty {
      padding: 6px 14px;
      font-size: 12px; line-height: 1.5;
      color: #94a3b8;
    }
    .hist-label {
      font-size: 12px; color: var(--muted-foreground);
      padding: 10px 14px 2px;
    }
    .hist-item {
      display: flex; align-items: center; gap: 6px; width: 100%;
      border: 0; background: transparent; color: var(--sidebar-foreground);
      text-align: left; padding: 8px 14px; min-height: 36px;
      border-radius: var(--radius); cursor: pointer; font-size: 13px;
    }
    .hist-item:hover, .hist-item.on { background: var(--sidebar-accent); }
    .hist-item.on { font-weight: 500; }
    .hist-title, .hist-pick-title {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hist-pin { width: 12px; height: 12px; flex: none; color: var(--muted-foreground); display: grid; place-items: center; }
    .hist-pin svg { width: 12px; height: 12px; }
    .matrix-loader {
      width: 1em; height: 1em; flex: none; display: block; pointer-events: none;
    }
    .hist-close {
      width: 32px; height: 32px; border: 0; background: transparent; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: var(--muted-foreground);
    }
    .hist-close:hover { background: var(--sidebar-accent); color: var(--foreground); }
    .hist-close svg { width: 16px; height: 16px; }
    .hist-group { margin-bottom: 4px; }
    .hist-pick {
      display: flex; align-items: center; gap: 12px; width: 100%;
      border: 0; background: transparent; text-align: left;
      padding: 12px; border-radius: 8px; cursor: pointer;
      font-size: 15px; color: var(--foreground);
    }
    .hist-pick:hover, .hist-pick.on { background: #f4f4f5; }
    .hist-pick .ant-checkbox-wrapper,
    .hist-pick .ant-checkbox { pointer-events: none; }
    .hist-pick .ant-checkbox-inner { border-radius: 50%; width: 18px; height: 18px; }
    .hist-pick .ant-checkbox-checked .ant-checkbox-inner {
      background: var(--primary); border-color: var(--primary);
    }
    .hist-foot { display: flex; align-items: stretch; min-height: 52px; }
    .hist-foot .ant-btn {
      flex: 1; height: 52px; border-radius: 0; font-size: 15px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: none;
    }
    .hist-foot .icon-svg, .hist-foot svg { width: 16px; height: 16px; }
    .hist-manage-pane .hist-scroll { padding: 0 4px 8px; }
    .hist-manage-pane .hist-label { padding: 10px 12px 2px; }
    .hist-manage-pane .hist-foot { border-top: 1px solid var(--border); }
    .nav-item:hover { background: var(--sidebar-accent); }
    .nav-item.on {
      background: var(--sidebar-accent);
      color: var(--sidebar-accent-foreground);
      font-weight: 500;
    }
    .nav-ico { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
    .nav-ico svg { width: 16px; height: 16px; }

    .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--background); }
    .topbar {
      height: var(--topbar-h); flex: none;

    .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .settings-save-hint { font-size: 13px; color: var(--muted-foreground); }
    .icon-btn {
      width: 32px !important; height: 32px !important; min-width: 32px !important;
      padding: 0 !important; overflow: hidden !important; line-height: 0 !important;
      display: inline-flex !important; align-items: center; justify-content: center;
    }
    .icon-btn > span,
    .icon-btn .icon-svg,
    .icon-btn .ant-btn-loading-icon {
      display: inline-flex !important; align-items: center; justify-content: center;
      line-height: 0 !important; margin: 0 !important; transform: none !important;
    }
    .icon-btn .icon-svg,
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .icon-btn .ant-btn-loading-icon .anticon { margin: 0 !important; }

    .content { flex: 1; min-height: 0; overflow: auto; padding: var(--pad); }
    .content.pane-ask { padding: 0; display: flex; overflow: hidden; }
    .content.pane-browser { padding: 0; display: flex; overflow: hidden; }
    .content.pane-settings { padding: 0; display: flex; overflow: hidden; }
    .content.pane-news { padding: 0; display: flex; overflow: hidden; }
    .content.pane-dashboard { padding: 0; display: flex; overflow: hidden; }
    .content.pane-backtest { padding: 0; display: flex; overflow: hidden; }
    .content.pane-catalog {
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pane-stage { min-width: 0; }
    .content.pane-ask > .pane-stage,
    .content.pane-browser > .pane-stage,
    .content.pane-settings > .pane-stage,
    .content.pane-news > .pane-stage,
    .content.pane-dashboard > .pane-stage,
    .content.pane-backtest > .pane-stage,
    .content.pane-catalog > .pane-stage {
      flex: 1; min-height: 0; height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .content.switching .hero,
    .content.switching .hit,
    .content.switching .chat-empty,
    .content.switching .msg:nth-last-child(-n+4),
    .content.switching .filters,
    .content.switching .cat-tree-pane,
    .content.switching .cat-toolbar,
    .content.switching .type-capsules,
    .content.switching .table-card,
    .content.switching .settings-card,
    .content.switching .dash-shell,
    .content.switching .mk-shell,
    .content.switching .news-shell,
    .content.switching .bt-shell,
    .content.switching .oc-main-container,

    .oc-main.switching .oc-group,
    .settings-body.switching .settings-card {
      animation: block-fade var(--aui-panel-in) both;
    }
    @keyframes block-fade {
      from { opacity: 0; transform: translateY(var(--aui-slide-y)); filter: blur(var(--aui-blur-switch)); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .pane-catalog .filters.mb { flex: none; }
    .pane-catalog .table-card {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }

    .pane-catalog .table-card .ant-spin-nested-loading,

    }
    .pane-catalog .table-card .ant-spin-container > .ant-table {
      flex: 1; min-height: 0; overflow: hidden;
    }

    .hero { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .hero h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }

    .search-row > .ant-input { flex: 1; min-width: 0; height: 40px; }
    .search-row .ant-btn { flex: none; height: 40px; }

    .filters.mb { margin-bottom: 16px; }

    .chip {
      border: 1px solid var(--border); background: var(--card); color: var(--foreground);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
      line-height: 1.3;
    }
    .chip:hover { background: var(--accent); }

    .results { display: flex; flex-direction: column; gap: 8px; }
    .hit {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 16px;
      display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    }
    .hit:hover { background: #f8fafc; border-color: #cbd5e1; }

      padding: 0 var(--pad) 0;
      opacity: 0;
      pointer-events: none;
      background: transparent;
      z-index: 12;
      transition:
        grid-template-rows var(--aui-disclosure),
        opacity var(--aui-fade);

      grid-template-rows: 1fr;
      padding: 14px var(--pad) 2px;
      opacity: 1;
      pointer-events: auto;

      transition: none !important;

      min-width: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      box-shadow: none !important;
      overflow: visible;
      transform-origin: center top;
      transform: translateY(-8px) scale(.96);
      opacity: 0;
      transition:
        transform var(--aui-disclosure),
        opacity var(--aui-fade),
        border-color var(--aui-color);

    /* ============== 新闻流主视图 ============== */

      background: var(--background);
    }
    .news-toolbar {

      padding: 10px 18px; border-bottom: 1px solid var(--border);

    }

    /* ============== 24列自由拖拽 & 无级缩放工作台 ============== */
    .fg-canvas {
      position: relative; width: 100%; min-height: 100%;
      transition: height .18s ease;
    }
    .fg-canvas.unlocked {
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px);
      background-size: var(--fg-col-step, 4.1667%) var(--fg-row-step, 32px);
      border-radius: 4px;
    }
    .fg-item {
      position: absolute; display: flex; flex-direction: column;
      background: var(--card); border: 1px solid var(--border); border-radius: 5px;
      overflow: hidden; container-type: inline-size;
      transition: left .18s cubic-bezier(.22, 1, .36, 1),
                  top .18s cubic-bezier(.22, 1, .36, 1),
                  width .18s cubic-bezier(.22, 1, .36, 1),
                  height .18s cubic-bezier(.22, 1, .36, 1),
                  border-color .14s ease,
                  box-shadow .14s ease;
    }
    .fg-item.is-active {
      transition: none !important;
      z-index: 45;
      border-color: var(--primary);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
      user-select: none;
    }
    .fg-item.is-max {
      position: fixed !important;
      inset: 42px 10px 26px 10px !important;
      width: auto !important;
      height: auto !important;
      z-index: 120 !important;
      transition: none !important;
      border-color: var(--primary);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.48);
      animation: fg-max-in var(--aui-spring-pop) both;
    }
    @keyframes fg-max-in {
      from { opacity: 0; transform: scale(0.94); filter: blur(var(--aui-blur-surface)); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .fg-max-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.56);
      z-index: 115; backdrop-filter: blur(2px);
    }
    .fg-ghost {
      position: absolute; border: 1.5px dashed var(--primary);
      background: rgba(59, 130, 246, 0.12); border-radius: 5px;
      pointer-events: none; z-index: 12;
      transition: left .09s ease, top .09s ease, width .09s ease, height .09s ease;
    }
    .fg-hud {
      position: fixed; right: 18px; bottom: 32px; z-index: 130;
      padding: 4px 10px; border-radius: 4px;
      background: var(--card); border: 1px solid var(--primary);
      color: var(--foreground); font-size: 11px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28); pointer-events: none;
    }
    .fg-canvas.unlocked .ft-panel-head { cursor: grab; user-select: none; }
    .fg-canvas.unlocked .ft-panel-head:active { cursor: grabbing; }
    .fg-canvas.unlocked .ft-panel-head .ft-ico-btn,
    .fg-canvas.unlocked .ft-panel-head .ft-btn,
    .fg-canvas.unlocked .ft-panel-head button { cursor: pointer; }
    .fg-rh { position: absolute; z-index: 25; }
    .fg-rh-e { top: 28px; right: 0; width: 6px; bottom: 14px; cursor: ew-resize; }
    .fg-rh-w { top: 28px; left: 0; width: 6px; bottom: 14px; cursor: ew-resize; }
    .fg-rh-s { left: 14px; right: 14px; bottom: 0; height: 6px; cursor: ns-resize; }
    .fg-rh-se {
      right: 0; bottom: 0; width: 15px; height: 15px; cursor: nwse-resize;
      display: flex; align-items: flex-end; justify-content: flex-end; padding: 3px;
    }
    .fg-rh-se::after {
      content: ""; width: 7px; height: 7px;
      border-right: 2px solid var(--muted-foreground);
      border-bottom: 2px solid var(--muted-foreground);
      opacity: .5; border-radius: 1px; transition: border-color .12s, opacity .12s;
    }
    .fg-item:hover .fg-rh-se::after,
    .fg-item.is-active .fg-rh-se::after { border-color: var(--primary); opacity: 1; }
    .fg-rh-sw {
      left: 0; bottom: 0; width: 14px; height: 14px; cursor: nesw-resize;
    }
    .fg-rh-e:hover, .fg-rh-w:hover { background: rgba(59, 130, 246, 0.24); }
    .fg-rh-s:hover { background: rgba(59, 130, 246, 0.24); }

    /* 容器查询：自由缩放时自动适配卡片内部列与结构 */
    @container (max-width: 520px) {

      .mk-row.mk-row-wl { grid-template-columns: 8px minmax(0, 1fr) 66px 54px 50px 18px !important; }

      .mk-row.mk-row-wl { grid-template-columns: 8px minmax(0, 1fr) 62px 52px 18px !important; }
      .mk-row.mk-row-mover { grid-template-columns: 8px minmax(0, 1fr) 60px 52px !important; }

    }

    /* ============== 分栏拖拽条 (Split Resizer) ============== */
    .sp-bar-v {
      width: 6px; flex: none; cursor: col-resize; position: relative;
      background: transparent; z-index: 15; user-select: none; touch-action: none;
    }
    .sp-bar-v::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px;
      background: var(--border);
      transform-origin: center center;
      transition: background-color var(--aui-color), transform var(--aui-spring-highlight);
    }
    .sp-bar-v.dragging::after {
      transform: scaleX(3); background: var(--primary);
    }
    @media (hover: hover) and (pointer: fine) {
      .sp-bar-v:hover::after {
        transform: scaleX(3); background: var(--primary);
      }
    }
    .sp-bar-h {
      height: 6px; flex: none; cursor: row-resize; position: relative;
      background: transparent; z-index: 15; user-select: none; touch-action: none;
    }
    .sp-bar-h::after {
      content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px;
      background: var(--border);
      transform-origin: center center;
      transition: background-color var(--aui-color), transform var(--aui-spring-highlight);
    }
    .sp-bar-h.dragging::after {
      transform: scaleY(3); background: var(--primary);
    }
    @media (hover: hover) and (pointer: fine) {
      .sp-bar-h:hover::after {
        transform: scaleY(3); background: var(--primary);
      }
    }
    body.is-splitting-v, body.is-splitting-v * { cursor: col-resize !important; user-select: none !important; }
    body.is-splitting-h, body.is-splitting-h * { cursor: row-resize !important; user-select: none !important; }

    .ft-pulse-rail {
      flex: none; background: var(--card);
      display: flex; flex-direction: column; min-height: 0; overflow-y: auto;
    }

    /* ============== 网格右上角『+』模块库入口、量化模块与对话内嵌可视化 ============== */
    .ft-dash-main, .mk-main { position: relative; }
    .fg-add-fab {
      position: sticky; top: 6px; float: right; margin-right: 4px; margin-bottom: -34px;
      z-index: 38; width: 32px; height: 32px; border-radius: 7px;
      border: 1px solid var(--primary); background: var(--primary); color: #fff;
      display: inline-grid; place-items: center; cursor: pointer;
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.36);
      transition: transform var(--aui-spring-press), box-shadow var(--aui-color), filter var(--aui-color), opacity var(--aui-fade);
    }
    @media (hover: hover) and (pointer: fine) {
      .fg-add-fab:hover {
        filter: brightness(1.08);
        box-shadow: 0 8px 24px rgba(59, 130, 246, 0.5);
      }
    }
    .fg-add-fab svg { width: 17px; height: 17px; }

    .qw-wrap { flex: 1; min-height: 0; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .qw-ctrl {
      flex: none; display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
      padding: 4px 8px; border-bottom: 1px solid var(--border); background: var(--background);
    }
    .qw-ctrl-thin { padding: 3px 8px; min-height: 24px; }
    .qw-subbar {
      width: 100%; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      font-size: 10.5px; color: var(--muted-foreground); padding-top: 2px;
    }
    .qw-kpi-strip {
      width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 5px;
      padding-top: 4px; border-top: 1px dashed var(--border);
    }
    .qw-kpi-mini {
      display: flex; flex-direction: column; gap: 1px; font-size: 10px;
      padding: 3px 6px; border-radius: 4px; background: var(--card); border: 1px solid var(--border);
    }
    .qw-kpi-mini b { font-size: 11.5px; color: var(--foreground); }
    .qw-pills { display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
    .qw-sel {
      height: 22px; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px;
      background: var(--card); color: var(--foreground); font-size: 11px; outline: none;

    .qw-inp {
      height: 20px; width: 92px; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px;
      background: var(--card); color: var(--foreground); font-size: 11px; outline: none; margin-left: auto;
    }
    .qw-inp:focus, .qw-sel:focus { border-color: var(--primary); }
    .qw-pct-pill {
      margin-left: auto; font-size: 11px; font-weight: 700; padding: 1px 6px;

    .qw-chart-stage { flex: 1; min-height: 0; position: relative; display: flex; padding: 2px 4px; }
    .qw-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 4px 8px; }

    .pbc-row {
      display: grid; grid-template-columns: minmax(76px, 112px) minmax(44px, 1fr) 44px 22px; align-items: center; gap: 6px;
      padding: 4px 2px; border-bottom: 1px solid var(--border); font-size: 11px; cursor: pointer;
    }
    .pbc-row.wide { grid-template-columns: minmax(82px, 120px) minmax(44px, 1fr) 42px 52px 22px; }
    .pbc-row:hover { background: var(--muted); }
    .pbc-track { height: 7px; border-radius: 99px; background: var(--muted); overflow: hidden; position: relative; }
    .pbc-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(148,163,184,0.55); z-index: 2; }
    .pbc-fill {
      width: 100%; height: 100%; border-radius: 99px;
      transition: transform var(--aui-spring-selection), background-color var(--aui-color);
    }

    /* 分析师精选小模块样式 */
    .mc-quads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; flex: none; }
    .mc-quad {
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--background); display: flex; flex-direction: column; gap: 1px;
      transition: border-color .15s, background .15s;
    }
    .mc-quad.on { box-shadow: inset 0 0 0 1px currentColor; }
    .mc-live-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }
    .mc-meters { display: flex; flex-direction: column; gap: 5px; flex: none; }
    .mc-meter-row { display: flex; align-items: center; gap: 6px; }
    .mc-playbook {
      display: flex; align-items: center; gap: 6px; padding: 5px 8px;
      border: 1px solid var(--border); border-radius: 4px; background: var(--muted); flex: none;
    }
    .mc-probes { display: flex; flex-wrap: wrap; gap: 4px; flex: none; }
    .mc-probe-pill {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
      border: 1px solid var(--border); border-radius: 3px; background: var(--background);
      font-size: 10px; cursor: pointer;
    }
    .mc-probe-pill:hover { border-color: var(--primary); }
    .mb-top { flex: none; display: flex; flex-direction: column; }
    .cd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 5px; }
    .cd-tile {
      padding: 6px 8px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--background); cursor: pointer; transition: border-color .12s;
    }
    .cd-tile:hover { border-color: var(--primary); }
    .cd-tile.hot { border-color: rgba(16, 185, 129, 0.45); background: rgba(16, 185, 129, 0.06); }
    .cd-tile.cold { border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.06); }
    .rs-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; flex: none; }
    .rs-card {
      padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--background); display: flex; flex-direction: column; gap: 2px; font-size: 10.5px;
    }
    .rs-card b { font-size: 13px; color: var(--foreground); }
    .rs-row {
      display: grid; grid-template-columns: minmax(0, 1fr) auto 58px; align-items: center; gap: 6px;
      padding: 4px 5px; border-bottom: 1px solid var(--border); font-size: 11px; cursor: pointer;
    }
    .rs-row:hover { background: var(--muted); }
    .ic-row {
      display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; align-items: center; gap: 6px;
      padding: 4px 2px; border-bottom: 1px solid var(--border); font-size: 11.5px;
    }
    .wg-analyst-tag {
      position: absolute; top: 6px; left: 6px; padding: 2px 7px; border-radius: 4px;
      font-size: 10px; font-weight: 700; background: rgba(16, 185, 129, 0.86); color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .sg-layout { display: flex; flex-direction: column; gap: 6px; }
    .sg-dial { display: flex; align-items: center; justify-content: center; flex-direction: column; flex: 1; min-height: 76px; }
    .sg-bars { display: flex; flex-direction: column; gap: 5px; font-size: 11px; flex: none; }
    @container (min-width: 440px) {
      .sg-layout { flex-direction: row !important; align-items: center; }
      .sg-dial { flex: 0 0 46%; }
      .sg-bars { flex: 1; min-width: 0; }
    }

    .div-alert-card {
      padding: 7px 9px; border: 1px solid var(--border); border-radius: 5px;
      background: var(--background); display: flex; flex-direction: column; gap: 4px; cursor: pointer;
    }
    .div-alert-card:hover { border-color: var(--primary); }
    .div-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: var(--muted); color: var(--foreground); }
    .div-tag.high { background: rgba(239, 68, 68, 0.16); color: var(--down); }
    .div-tag.medium, .div-tag.warn { background: rgba(245, 158, 11, 0.18); color: var(--warn); }
    .div-tag.ok { background: rgba(16, 185, 129, 0.16); color: var(--up); }
    .div-tag.info { background: rgba(59, 130, 246, 0.16); color: var(--primary); }

    /* ============== 全市场搜股 + 一键自选组件 (SymbolPicker) ============== */
    .sp-picker { position: relative; min-width: 0; max-width: 100%; }
    .sp-trigger {
      height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 7px;
      border: 1px solid var(--border); border-radius: 4px; background: var(--card);
      color: var(--foreground); font-size: 11.5px; cursor: text; transition: border-color .12s;
    }
    .sp-picker.compact .sp-trigger { height: 22px; padding: 0 6px; font-size: 11px; border-radius: 3px; }
    .sp-picker.open .sp-trigger, .sp-trigger:hover { border-color: var(--primary); }
    .sp-ico { width: 12px; height: 12px; flex: none; color: var(--muted-foreground); display: inline-flex; }
    .sp-ico svg { width: 12px; height: 12px; }
    .sp-input {
      flex: 1; min-width: 0; width: 100%; border: 0; outline: none; background: transparent;
      color: var(--foreground); font-size: inherit; padding: 0;
    }
    .sp-input::placeholder { color: var(--muted-foreground); }
    .sp-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .sp-caret { flex: none; font-size: 10px; color: var(--muted-foreground); }
    .sp-popover {
      background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28); max-height: 300px; overflow-y: auto;
    }
    .sp-pop-body { display: flex; flex-direction: column; }
    .sp-pop-sec {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 5px 9px; font-size: 10.5px; font-weight: 700; color: var(--muted-foreground);
      background: var(--muted); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 2;
    }
    .sp-pop-empty { padding: 14px 10px; text-align: center; font-size: 11.5px; color: var(--muted-foreground); }
    .sp-pop-item {
      display: grid; grid-template-columns: 74px minmax(0, 1fr) auto auto; align-items: center; gap: 6px;
      padding: 5px 8px; font-size: 11.5px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .sp-pop-item:hover, .sp-pop-item.on { background: var(--muted); }
    .sp-pop-item.on { box-shadow: inset 2px 0 0 var(--primary); }
    .sp-code { color: var(--primary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-name { color: var(--foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-mkt { font-size: 10px; color: var(--muted-foreground); white-space: nowrap; }
    .sp-pct { font-size: 10.5px; font-weight: 600; white-space: nowrap; }
    .sp-wl-pill {
      height: 20px; padding: 0 6px; border: 1px solid var(--border); border-radius: 3px;
      background: transparent; color: var(--muted-foreground); cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 600;
      white-space: nowrap;
      transition: color var(--aui-color), border-color var(--aui-color), background-color var(--aui-color), transform var(--aui-spring-press);
    }
    .sp-wl-pill:hover { border-color: #f59e0b; color: #f59e0b; background: rgba(245, 158, 11, 0.10); }
    .sp-wl-pill.on { border-color: rgba(245, 158, 11, 0.55); color: #f59e0b; background: rgba(245, 158, 11, 0.14); }
    .sp-wl-ico { width: 11px; height: 11px; display: inline-flex; }
    .sp-wl-ico svg { width: 11px; height: 11px; }
    .wcd-body { display: flex; flex-direction: column; gap: 12px; }
    .wcd-sec {
      border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px;
      background: var(--card); display: flex; flex-direction: column; gap: 8px;
    }
    .wcd-sec-title { font-size: 12px; font-weight: 700; color: var(--foreground); }
    .wcd-row { display: grid; grid-template-columns: 62px minmax(0, 1fr); align-items: center; gap: 8px; font-size: 12px; }
    .wcd-checks { display: flex; flex-wrap: wrap; gap: 5px; }
    .wcd-rl-item {
      display: flex; align-items: center; gap: 6px; padding: 3px 6px;
      border: 1px solid var(--border); border-radius: 4px; background: var(--background); font-size: 11.5px;
    }
    .wcd-foot {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding-top: 8px; border-top: 1px solid var(--border);
    }
    .sp-star-btn {
      width: 20px; height: 20px; border: 0; border-radius: 3px; background: transparent;
      color: var(--muted-foreground); cursor: pointer; display: inline-grid; place-items: center; padding: 0;
    }
    .sp-star-btn:hover { background: var(--border); color: var(--warn); }
    .sp-star-btn.on { color: #f59e0b; }
    .sp-star-btn svg { width: 13px; height: 13px; }
    .sp-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .sp-tag {
      display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px;
      border: 1px solid var(--border); border-radius: 3px; background: var(--muted);
      color: var(--foreground); font-size: 10.5px; font-weight: 600;
    }
    .sp-tag button {
      border: 0; background: transparent; color: var(--muted-foreground); cursor: pointer;
      padding: 0; font-size: 12px; line-height: 1;
    }
    .sp-tag button:hover { color: var(--down); }

    .wg-grid {
      max-height: 64vh; overflow-y: auto; padding-right: 4px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(276px, 1fr)); gap: 12px;
    }
    .wg-card {
      border: 1px solid var(--border); border-radius: 8px; background: var(--card);
      overflow: hidden; display: flex; flex-direction: column;
      transition: border-color var(--aui-color), box-shadow var(--aui-color), transform var(--aui-spring-highlight);
    }

        transform: scale(1.05);
      }

    .wg-thumb img {
      transition: transform var(--aui-spring-highlight);
    }

      border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
    }

    .wg-cat-tag {
      position: absolute; top: 6px; right: 6px; padding: 2px 7px; border-radius: 4px;
      font-size: 10px; font-weight: 700; background: rgba(15, 23, 42, 0.82); color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.35);

    .wg-actions { margin-top: auto; padding-top: 6px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }

    .wg-studio { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; min-height: 360px; }
    .wg-studio-form { display: flex; flex-direction: column; gap: 10px; }
    .wg-studio-preview { display: flex; flex-direction: column; min-width: 0; }

    .chat-vis-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .chat-vis-card {
      border: 1px solid var(--border); border-radius: 8px; background: var(--card);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .chat-vis-head {
      padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--muted);
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }

    .chat-vis-topic { padding: 10px 12px; background: var(--background); }

    @media (max-width: 1120px) {
      .wg-studio { grid-template-columns: 1fr; }

    .ft-ico-btn.danger:hover { background: rgba(239, 68, 68, 0.16); color: var(--down); }
    .ft-ico-btn.is-spinning {
      color: var(--primary);
      background: rgba(59, 130, 246, 0.12);

    .ft-panel-status.is-done { color: var(--ok); background: rgba(16, 185, 129, 0.12); font-weight: 600; }

    /* ============== 实体热度与共现网络优化面板 ============== */
    .ep-body { padding: 6px 8px; gap: 6px; overflow: hidden; }
    .ep-toolbar {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 6px; min-height: 20px;
    }
    .ep-pills {
      display: inline-flex; align-items: center; gap: 2px; padding: 1px;
      border-radius: 4px; background: var(--muted); border: 1px solid var(--border); flex: none;
    }

      border: 0; background: transparent; color: var(--muted-foreground); cursor: pointer;

      border-radius: 3px; transition: background .14s, color .14s;

      display: inline-flex; align-items: center; gap: 7px; font-size: 10px;
      color: var(--muted-foreground); min-width: 0; overflow: hidden;
    }
    .ep-leg-item { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }

    .ep-main {

    /* ============== D3-Geo Editorial World Intelligence Atlas ============== */
    .ga-root {

      background: #f5f8fc;

    .ga-svg { display: block; width: 100%; height: 100%; }

    .ga-country { transition: fill-opacity .16s ease, filter .16s ease; }
    .ga-country.is-active { cursor: pointer; }
    .ga-country.is-active:hover { filter: brightness(0.95); }
    .ga-root.is-dark .ga-country.is-active:hover { filter: brightness(1.18); }

    .ga-arc { cursor: pointer; transition: stroke-opacity .18s ease; }
    .ga-arc.is-conflict-flow { animation: ga-dash 2.4s linear infinite; }
    @keyframes ga-dash {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }

    .ga-event-beacon { cursor: pointer; }
    .ga-pulse-ring {
      transform-box: fill-box; transform-origin: center;
      animation: ga-ripple 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    @keyframes ga-ripple {
      0% { opacity: 0.78; transform: scale(0.45); }
      75% { opacity: 0.08; transform: scale(1.38); }
      100% { opacity: 0; transform: scale(1.48); }
    }

    .ga-entity-node { cursor: pointer; transition: opacity .16s ease; }
    .ga-label {
      pointer-events: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: -0.01em;
    }

    .ga-tx-curve { animation: ga-dash 1.8s linear infinite; }

    .ga-layer-chip {

    .ga-root.is-dark .ga-layer-chip {
      background: rgba(15, 23, 42, 0.78); color: #64748b; border-color: rgba(148, 163, 184, 0.22);
    }
    .ga-root.is-dark .ga-layer-chip.on { color: #e2e8f0; border-color: rgba(148, 163, 184, 0.44); }
    .ga-chip-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
    .ga-chip-line { width: 8px; height: 1.5px; border-top: 1.5px dashed #d97706; display: inline-block; }

    .ga-conflict-scale {

    /* Bottom Floating Financial Asset Impact Dock (利多 / 利空) */
    .ga-dock {

      background: rgba(220, 38, 38, 0.1); border-color: rgba(220, 38, 38, 0.28); color: #b91c1c;
    }
    .ga-asset-chip.neutral {
      background: rgba(100, 116, 139, 0.1); border-color: rgba(100, 116, 139, 0.24); color: #475569;
    }
    .ga-root.is-dark .ga-asset-chip.bullish {

    }

    .ga-asset-score { font-size: 9.5px; opacity: 0.85; }

    /* Causal Flow View */

    }

    /* Floating Editorial Tooltip */

    .ep-loading-bar {

      transition:
        background-color var(--aui-color),
        border-color var(--aui-color),
        box-shadow var(--aui-color),
        transform var(--aui-spring-press);
    }
    .hit:active,
    .src:active,
    .ask-chip:active,
    .ask-opt:active:not(:disabled),
    .oc-layout-card:active,
    .news-card:active,
    .anf-item:active,
    .dash-conn-card:active,
    .mk-kpi:active,
    .cd-tile:active,
    .div-alert-card:active,
    .wg-card:active,
    .bt-preset-card:active,
    .bt-pool-item:active,
    .hist-item:active,
    .inbox-item:active {
      transform: scale(var(--aui-scale-choice));
    }

    /* A3: 仅在精细悬停指针设备启用卡片微抬升 */
    @media (hover: hover) and (pointer: fine) {
      .bt-preset-card:hover,
      .dash-conn-card:hover,
      .mk-kpi:hover {
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
      }
      .ga-asset-chip:hover,
      .ga-asset-chip.is-hl {
        transform: translateY(-1px);
      }
    }

    /* Animate UI 辅助组件样式：图标旋转切换、折叠箭头平滑旋转、数字滚动 */
    .aui-icon-swap {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 1em;
      height: 1em;
    }
    .aui-icon-swap-item {
      grid-area: 1 / 1;
      display: inline-grid;
      place-items: center;
      line-height: 0;
    }
    .aui-icon-swap-item svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .aui-metric-num {
      display: inline-flex;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
      line-height: 1.25;
    }
    .bt-acc-chev,
    .srcs-chev {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      transition: transform var(--aui-disclosure);
    }
    .bt-acc-chev.open,
    .srcs-chev.open {
      transform: rotate(90deg);
    }
    .srcs-head {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Animate UI 整页主题擦除 View Transition (catalog.md § Theme wipe) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    :root:active-view-transition-type(animate-ui-theme) body,
    :root:active-view-transition-type(animate-ui-theme) body * {
      view-transition-name: none !important;
    }

    /* Ant Design Vue 全局浮层/弹窗/抽屉/开关动效节奏对齐 Animate UI Tokens */
    .ant-modal-wrap .ant-zoom-enter,
    .ant-modal-wrap .ant-zoom-appear {
      animation-duration: calc(400ms * var(--aui-tempo)) !important;
      animation-timing-function: var(--aui-ease-soft) !important;
    }
    .ant-modal-wrap .ant-zoom-leave {
      animation-duration: calc(200ms * var(--aui-tempo)) !important;
      animation-timing-function: var(--aui-ease-away) !important;
    }
    .ant-modal-mask,
    .ant-drawer-mask {
      backdrop-filter: blur(2px);
      transition: background-color var(--aui-overlay), opacity var(--aui-overlay) !important;
    }
    .ant-drawer-content-wrapper {
      transition: transform var(--aui-sheet) !important;
    }
    .ant-select-dropdown.ant-slide-up-enter,
    .ant-select-dropdown.ant-slide-up-appear,
    .ant-dropdown.ant-slide-up-enter,
    .ant-dropdown.ant-slide-up-appear,
    .ant-select-dropdown.ant-slide-up-leave,
    .ant-dropdown.ant-slide-up-leave {
      animation-duration: calc(220ms * var(--aui-tempo)) !important;
      animation-timing-function: var(--aui-ease-soft) !important;
    }
    .ant-tooltip.ant-zoom-big-fast-enter,
    .ant-tooltip.ant-zoom-big-fast-appear {
      animation-duration: calc(200ms * var(--aui-tempo)) !important;
      animation-timing-function: var(--aui-ease-out) !important;
    }
    .ant-switch .ant-switch-handle {
      transition: inset-inline-start var(--aui-spring-thumb), width var(--aui-color) !important;
    }
    .ant-switch .ant-switch-handle::before {
      transition: inset-inline-start var(--aui-spring-thumb), inset-inline-end var(--aui-spring-thumb) !important;
    }

    .ft-sync-pill {
      display: inline-flex; align-items: center; gap: 5px;
      height: 22px; padding: 0 8px; border-radius: 99px;
      background: rgba(59, 130, 246, 0.12); color: var(--primary);
      font-size: 11px; font-weight: 500;
    }
    .ft-sync-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
      animation: pulse-op 1.2s ease-in-out infinite;
    }
    @keyframes pulse-op {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* A1 & A4: 减弱动态保留淡入淡出与轻模糊、归零位移/缩放/装饰循环、加载器降速不冻死 */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --aui-scale-press: 1;
        --aui-scale-choice: 1;
        --aui-slide-y: 0px;
      }
      html { scroll-behavior: auto !important; }
      .slide-pill,
      .tree-kb-knob,
      .fg-item,
      .fg-ghost,
      .pbc-fill,
      .ep-heat-fill,
      .bt-acc-chev,
      .srcs-chev {
        transition-property: opacity, background-color, border-color, color !important;
        transition-duration: 180ms !important;
      }
      .ask-bw-dock,
      .ask-bw-window {
        transition: opacity 180ms ease !important;
      }
      .ask-bw-window { transform: none !important; }
      .fg-item.is-max {
        animation: page-in 180ms ease both !important;
      }
      .wg-card:hover,
      .wg-card:hover .wg-thumb img,
      .ga-asset-chip:hover,
      .ga-asset-chip.is-hl {
        transform: none !important;
      }
      /* 装饰性无限循环停止 */
      .ga-arc.is-conflict-flow,
      .ga-pulse-ring,
      .ga-tx-curve,
      .model-pill-text::after,
      .page-skel.is-shimmer::after,
      .oc-kbd-recording {
        animation: none !important;
      }
      /* 加载指示器改为慢速温和提示（绝不冻成静帧） */
      .bw-spin,
      .tree-spin.on,
      .ft-ico-btn.is-spinning svg {
        animation: pulse-op 1.8s ease-in-out infinite !important;
      }
      .ft-sync-dot,
      .tool-dot.running {
        animation-duration: 2.2s !important;
      }
      .ep-loading-bar::after {
        width: 100%;
        animation: pulse-op 1.6s ease-in-out infinite !important;
      }
    }

    @media (max-width: 1120px) {
      .ft-panel.span-4, .ft-panel.span-6, .ft-panel.span-8 { grid-column: span 12; }
      .ft-wire-detail { width: 340px; }
      .mk-movers { grid-template-columns: 1fr; }
    }

    /* ============== 量化回测与因子实验室（零溢出高密度金融终端） ============== */
    .bt-shell, .bt-shell * { box-sizing: border-box; }
    .bt-shell {
      flex: 1; min-height: 0; height: 100%; display: flex; flex-direction: column;
      background: var(--background); color: var(--foreground); overflow: hidden;
      font-variant-numeric: tabular-nums;
    }
    .bt-topbar {
      flex: none; min-height: 38px; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; padding: 4px 12px;
      border-bottom: 1px solid var(--border); background: var(--card); font-size: 12px;
    }
    .bt-tb-left, .bt-tb-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }
    .bt-mode-strip {
      display: inline-flex; align-items: center; gap: 2px; background: var(--muted);
      padding: 2px; border-radius: 5px; border: 1px solid var(--border);
    }

      border: 0; background: transparent; color: var(--muted-foreground);

    .bt-mt:hover { color: var(--foreground); }

    .bt-tbtn {
      border: 1px solid var(--border); background: var(--muted); color: var(--foreground);
      font-size: 11.5px; line-height: 1.3; padding: 3px 9px; border-radius: 4px;
      cursor: pointer; white-space: nowrap; flex: none;

    .bt-tbtn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .bt-tbtn:disabled { opacity: .4; cursor: not-allowed; }
    .bt-tbtn.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
    .bt-stat-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; line-height: 1.3;
      border-radius: 4px; border: 1px solid var(--border); background: var(--muted);
      color: var(--muted-foreground); font-size: 11px; cursor: pointer; white-space: nowrap;
    }
    .bt-stat-pill.ok { color: var(--up); border-color: rgba(16,185,129,.35); background: rgba(16,185,129,.1); }
    .bt-stat-pill.warn { color: var(--warn); border-color: rgba(245,158,11,.35); background: rgba(245,158,11,.1); }
    .bt-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

    /* 三栏 IDE 工作台 */
    .bt-ide { flex: 1; min-height: 0; display: flex; overflow: hidden; }
    .bt-rail-left {
      width: 224px; flex: none; border-right: 1px solid var(--border); background: var(--card);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .bt-rail-right {
      width: 328px; flex: none; border-left: 1px solid var(--border); background: var(--card);
      display: flex; flex-direction: column; overflow: hidden;

      border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .bt-rh-title { font-size: 11.5px; font-weight: 700; color: var(--foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 实验列表 Rail */
    .bt-cmp-banner {
      display: flex; align-items: center; justify-content: space-between; padding: 5px 8px;
      font-size: 11.5px; background: rgba(59,130,246,.1); border-bottom: 1px solid var(--border); color: var(--primary);
    }

      padding: 7px 8px; border-bottom: 1px solid var(--border); cursor: pointer;
      display: flex; flex-direction: column; gap: 4px; transition: background .1s;
    }

    .bt-run-row.on { background: rgba(59,130,246,.12); box-shadow: inset 2px 0 0 var(--primary); }
    .bt-run-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .bt-run-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }
    .bt-run-del { border: 0; background: transparent; color: var(--muted-foreground); cursor: pointer; padding: 0 4px; font-size: 14px; line-height: 1; opacity: 0; flex: none; }
    .bt-run-row:hover .bt-run-del { opacity: 1; }

    .bt-chk { width: 14px; height: 14px; margin: 0; accent-color: var(--primary); cursor: pointer; flex: none; }
    .bt-eng-mini {
      display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 5px; line-height: 1.3;
      border-radius: 3px; background: var(--muted); border: 1px solid var(--border); color: var(--primary); white-space: nowrap; flex: none;
    }
    .bt-link-btn { border: 0; background: transparent; color: var(--primary); font-size: 11.5px; cursor: pointer; padding: 0 4px; white-space: nowrap; }

    /* 运行条 & 聚宽风格顶栏报告带（自适应换行，绝不溢出） */
    .bt-run-bar {
      flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 10px;
      font-size: 12px; background: rgba(59,130,246,.1); border-bottom: 1px solid var(--border); color: var(--primary);
    }
    .bt-run-bar.err { background: rgba(239,68,68,.1); color: var(--down); }
    .bt-rep-banner { flex: none; border-bottom: 1px solid var(--border); background: var(--card); }
    .bt-rb-top {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 5px 10px; border-bottom: 1px solid var(--border); background: var(--muted);
    }
    .bt-rb-name { font-size: 12.5px; font-weight: 700; color: var(--foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .bt-rb-dates { font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
    .bt-ribbon {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    }
    .bt-rb-cell {
      padding: 6px 10px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 2px; min-width: 0;

    .bt-rb-cell span { font-size: 10.5px; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bt-rb-cell strong { font-size: 13px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 中央主画布 */
    .bt-canvas-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--background); }
    .bt-panel-bar {
      flex: none; min-height: 32px; padding: 4px 8px; background: var(--muted); border-bottom: 1px solid var(--border);

    .bt-vtab.on { background: var(--card); color: var(--primary); font-weight: 600; border-color: var(--border); }
    .bt-view-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .bt-seg { display: inline-flex; background: var(--background); border: 1px solid var(--border); border-radius: 4px; padding: 2px; gap: 2px; flex-wrap: wrap; }

      border: 0; background: transparent; color: var(--muted-foreground);
      font-size: 11px; line-height: 1.3; padding: 2px 7px; border-radius: 3px; cursor: pointer; white-space: nowrap;
    }
    .bt-seg-btn:hover { color: var(--foreground); }
    .bt-seg-btn.on { background: var(--primary); color: #fff; font-weight: 600; }

    .bt-canvas-body { flex: 1; min-height: 0; position: relative; overflow: hidden; padding: 6px; display: flex; flex-direction: column; }
    .bt-empty-box { margin: auto; text-align: center; padding: 28px; max-width: 500px; }
    .bt-empty-h { font-size: 14.5px; font-weight: 600; margin-bottom: 6px; }

    /* FreqUI K线复盘 */
    .bt-kline-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .bt-kline-legend {
      flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 2px 6px 6px; font-size: 11px; color: var(--muted-foreground);
    }
    .bt-kl-sym { font-weight: 700; color: var(--foreground); }
    .bt-kl-item { display: inline-flex; align-items: center; gap: 4px; }
    .bt-kl-item i { display: inline-block; width: 9px; height: 3px; border-radius: 1px; }
    .bt-kline-canvas { flex: 1; min-height: 0; width: 100%; }

    /* 2x2 风险归因与因子面板（充裕高度，可滚不挤爆） */
    .bt-risk-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px; }
    .bt-risk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

    .bt-risk-grid-tall > .bt-subpanel { height: 290px; }

      display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;

      flex: none; min-height: 30px; padding: 4px 10px; background: var(--muted); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      font-size: 11.5px; font-weight: 600;
    }
    .bt-subbody { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .bt-scroll { overflow: auto !important; }
    .bt-subbody.bt-scroll > * { flex-shrink: 0; }

    /* 参数扫描 */

    .bt-sweep-info {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 6px 10px; font-size: 11.5px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px;
    }

      flex: none; border-top: 1px solid var(--border); background: var(--card);
      display: flex; flex-direction: column; position: relative;
    }
    .bt-dock-handle { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 10; }
    .bt-dock-handle:hover { background: rgba(59,130,246,.35); }
    .bt-dock-body { flex: 1; min-height: 0; overflow: auto; }
    .bt-log-box { padding: 8px 12px; font-size: 11.5px; line-height: 1.6; color: var(--foreground); }
    .bt-log-line { border-bottom: 1px dashed var(--border); padding: 2px 0; word-break: break-all; }

    .bt-cfg-scroll > * { flex-shrink: 0; }
    .bt-preset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }

    .bt-pc-t { font-size: 11.5px; font-weight: 600; color: var(--foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bt-pc-s { font-size: 10.5px; color: var(--muted-foreground); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .bt-time-card {

      background: rgba(59,130,246,.06); display: flex; flex-direction: column; gap: 6px;
    }
    .bt-tc-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; font-size: 11.5px; font-weight: 600; }

    }

    .bt-acc { border: 1px solid var(--border); border-radius: 5px; overflow: hidden; background: var(--background); }

      width: 100%; border: 0; background: var(--muted); color: var(--foreground);

      display: flex; align-items: center; justify-content: space-between;
    }
    .bt-acc-b { padding: 9px 10px; display: flex; flex-direction: column; gap: 8px; }
    .bt-g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .bt-fg { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

    .bt-sw-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted-foreground); }

      border: 1px solid var(--border); background: var(--muted); color: var(--muted-foreground);

    }
    .bt-chip:hover { border-color: var(--primary); color: var(--foreground); }
    .bt-chip.on { background: rgba(59,130,246,.14); border-color: var(--primary); color: var(--primary); font-weight: 600; }
    .bt-basket-pill {
      display: flex; align-items: center; justify-content: space-between; font-size: 11.5px;
      padding: 5px 8px; border-radius: 4px; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.35); color: var(--up);
    }
    .bt-cfg-foot {
      flex: none; padding: 8px 10px; border-top: 1px solid var(--border);
      background: var(--card); z-index: 2;
    }

    /* 机构指标表 */
    .bt-metric-grp { border: 1px solid var(--border); border-radius: 5px; overflow: hidden; background: var(--background); }
    .bt-mg-h { padding: 5px 9px; background: var(--muted); border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; color: var(--muted-foreground); }
    .bt-mg-row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 9px; font-size: 11.5px; border-bottom: 1px dashed var(--border); }
    .bt-mg-row:last-child { border-bottom: 0; }
    .bt-mg-row span { color: var(--muted-foreground); }

    /* 通用高密度表格 */
    .bt-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
    .bt-tbl th {
      position: sticky; top: 0; z-index: 1; background: var(--muted);
      text-align: left; font-size: 11px; font-weight: 600; color: var(--muted-foreground);
      padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .bt-tbl th.sortable { cursor: pointer; user-select: none; }
    .bt-tbl th.sortable:hover { color: var(--primary); }
    .bt-tbl td { padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; color: var(--foreground); }
    .bt-tbl tbody tr:hover td { background: var(--muted); }
    .bt-tbl tbody tr.on td { background: rgba(59,130,246,.12); }
    .bt-tbl tbody tr.clickable { cursor: pointer; }
    .bt-mheat th, .bt-mheat td { text-align: center; padding: 4px 3px; font-size: 11px; }
    .bt-up { color: var(--up) !important; }
    .bt-down { color: var(--down) !important; }

    /* 模式 2: 因子投研台（整页可顺畅滚动，绝不挤压裁剪） */
    .bt-fac-scroll-page { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
    .bt-fac-toolbar {
      flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 7px 12px; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .bt-basket-bar { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; padding: 3px 8px; border-radius: 4px; background: var(--muted); border: 1px solid var(--border); }
    .bt-lb-box { flex: none; height: 320px; overflow: auto; border-bottom: 1px solid var(--border); background: var(--card); }
    .bt-formula-cell { max-width: 240px; overflow: hidden; text-overflow: ellipsis; color: var(--muted-foreground); font-size: 11px; }
    .bt-formula-bar {
      flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 7px 12px; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .bt-fac-charts { flex: none; padding: 10px 12px 18px; }
    .bt-corr-warn {
      padding: 6px 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px;
      background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.35); color: var(--warn);
    }

    /* 模式 3: 数据同步 */
    .bt-data-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow: hidden; }
    .bt-data-top { flex: 1; min-height: 0; display: flex; gap: 10px; overflow: hidden; }
    .bt-pool-grid { display: flex; flex-direction: column; gap: 5px; }
    .bt-pool-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--background); cursor: pointer;
    }
    .bt-pool-item.on { border-color: var(--primary); background: rgba(59,130,246,.08); }
    .bt-pool-txt { min-width: 0; flex: 1; }
    .bt-pool-t { font-size: 12px; font-weight: 600; color: var(--foreground); line-height: 1.3; }
    .bt-resume-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 6px 9px; border-radius: 5px; font-size: 11.5px;
      background: rgba(245,158,11,.10); border: 1px solid rgba(245,158,11,.30); color: var(--foreground);
    }
    .bt-sync-term {
      padding: 7px 9px; border-radius: 4px; background: var(--background); border: 1px solid var(--border); font-size: 11.5px; word-break: break-word;
    }

    @media (max-width: 1180px) {
      .bt-risk-grid { grid-template-columns: 1fr; }
      .bt-data-top { flex-direction: column; overflow-y: auto; }
    }

    /* ============== Animate UI Native Components (Reka UI + Standalone Primitives) ============== */
    /* 1. Shared Gliding Tooltip (@animate-ui/vue/primitives/tooltip) */
    .aui-tooltip-content {
      z-index: 2200;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.35;
      font-weight: 500;
      color: #f8fafc;
      background: #0f172a;
      box-shadow: 0 8px 24px rgba(2, 6, 23, 0.28);
      pointer-events: none;
      max-width: 280px;
      white-space: nowrap;
    }
    html[data-theme="dark"] .aui-tooltip-content {
      background: #e2e8f0;
      color: #0b0f17;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .aui-tooltip-arrow {
      fill: #0f172a;
    }
    html[data-theme="dark"] .aui-tooltip-arrow {
      fill: #e2e8f0;
    }

    /* 2. Animate UI Highlight gliding indicator surfaces */
    .aui-hl-surface {
      border-radius: var(--radius);
      background: #dbeafe;
      pointer-events: none;
    }
    html[data-theme="dark"] .aui-hl-surface {
      background: rgba(59, 130, 246, 0.22);
    }
    .aui-hl-pill-surface {
      border-radius: 5px;
      background: var(--primary);
      pointer-events: none;
    }
    .aui-hl-card-surface {
      border-radius: 4px;
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }
    .aui-hl-seg-surface {
      border-radius: 4px;
      background: #0f172a;
      pointer-events: none;
    }
    html[data-theme="dark"] .aui-hl-seg-surface {
      background: #2563eb;
    }
    .aui-hl-cap-surface {
      border-radius: 6px;
      background: #1d4ed8;
      box-shadow: 0 2px 6px rgba(29, 78, 216, .22);
      pointer-events: none;
    }
    .aui-hl-doc-surface {
      border-radius: 4px;
      background: var(--secondary);
      pointer-events: none;
    }
    .nav-switch [data-slot="highlight-item"],
    .provider-list [data-slot="highlight-item"] {
      width: 100%;
    }
    .news-lang-pills .news-pill-btn[data-slot="highlight-item"].on,
    .bt-mode-strip .bt-mt[data-slot="highlight-item"].on,
    .bt-view-tabs .bt-vtab[data-slot="highlight-item"].on,
    .bt-seg .bt-seg-btn[data-slot="highlight-item"].on,
    .ep-pills .ep-pill[data-slot="highlight-item"].on,
    .ga-seg .ga-seg-btn[data-slot="highlight-item"].on,
    .type-capsules .type-cap[data-slot="highlight-item"].on,
    .seg .seg-item[data-slot="highlight-item"].on {
      background: transparent !important;
      box-shadow: none !important;
      position: relative;
      z-index: 1;
    }
    .news-lang-pills .news-pill-btn,
    .bt-mode-strip .bt-mt,
    .bt-view-tabs .bt-vtab,
    .bt-seg .bt-seg-btn,
    .ep-pills .ep-pill,
    .ga-seg .ga-seg-btn,
    .type-capsules .type-cap,
    .seg .seg-item {
      position: relative;
      z-index: 1;
    }
    .bt-view-tabs .bt-vtab.on {
      border-color: transparent !important;
    }

    /* 3. MotionGrid 3x3 Loader */
    .aui-motion-loader {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5px;
      flex: none;
      pointer-events: none;
    }
    .aui-mg-cell {
      border-radius: 50%;
      background: color-mix(in srgb, var(--primary) 20%, transparent);
      transition: background-color 140ms ease, transform 140ms ease;
    }
    .aui-mg-cell.on {
      background: var(--primary);
      transform: scale(1.1);
    }

    /* 4. Particle Star Button & Copy Button */
    .aui-star-particle {
      color: #f59e0b;
    }
    .aui-copy-btn {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer;
      transition: background-color var(--aui-color), color var(--aui-color), border-color var(--aui-color), opacity var(--aui-fade);
    }
    .aui-copy-btn:hover {
      color: var(--foreground);
      border-color: var(--primary);
      background: var(--muted);
    }
    .aui-copy-ico {
      display: inline-grid;
      place-items: center;
      width: 14px;
      height: 14px;
    }
    .aui-copy-ico svg { width: 14px; height: 14px; display: block; }
    .aui-copy-ico.copied { color: var(--ok); }
    .md-pre-wrap {
      position: relative;
      margin: .4em 0;
    }
    .md-pre-wrap > .md-pre {
      margin: 0;
      padding-right: 40px;
    }
    .md-pre-copy {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      color: var(--muted-foreground);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity var(--aui-fade), color var(--aui-color), border-color var(--aui-color), background-color var(--aui-color), transform var(--aui-spring-press);
    }
    .md-pre-wrap:hover .md-pre-copy,
    .md-pre-copy:focus-visible,
    .md-pre-copy.is-copied {
      opacity: 1;
    }
    .md-pre-copy.is-copied {
      color: var(--ok);
      border-color: rgba(16, 185, 129, 0.45);
    }
    .md-pre-copy svg { width: 13px; height: 13px; display: block; }

    /* 5. ScrollProgress reading bar & ScrollFade */
    .aui-scroll-progress-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .aui-scroll-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      z-index: 6;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      border-radius: 0 2px 2px 0;
      pointer-events: none;
    }
    .chatlog.aui-scroll-fade {
      mask-image: none;
      -webkit-mask-image: none;
    }

    /* 6. PinnedList sidebar groups */
    .aui-pinned-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }
    .aui-pinned-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-foreground);
      padding: 6px 12px 2px;
      letter-spacing: .03em;
    }
    .aui-pinned-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .hist-pin-btn {
      width: 20px;
      height: 20px;
      flex: none;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted-foreground);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      opacity: 0;
      transition: opacity var(--aui-fade), color var(--aui-color), background-color var(--aui-color), transform var(--aui-spring-press);
    }
    .hist-pin-btn.on { opacity: 0.9; color: var(--primary); }
    .hist-item:hover .hist-pin-btn,
    .inbox-item:hover .hist-pin-btn,
    .hist-pin-btn:focus-visible { opacity: 1; }
    .hist-pin-btn:hover { background: var(--sidebar-accent); color: var(--primary); }
    .hist-pin-btn svg { width: 12px; height: 12px; display: block; }

    /* 7. Animate UI Reka Dialog (3D tilt entrance + backdrop blur) */
    .aui-dialog-overlay {
      position: fixed;
      inset: 0;
      z-index: 990;
      background: rgba(2, 6, 23, 0.46);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    .aui-dialog-content {
      position: fixed;
      inset: 0;
      margin: auto;
      z-index: 1000;
      height: fit-content;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 24px 64px rgba(2, 6, 23, 0.24);
      overflow: hidden;
      outline: none;
    }
    html[data-theme="dark"] .aui-dialog-content {
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.56);
    }
    .aui-dialog-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
    }
    .aui-dialog-title {
      margin: 0;
      font-size: 15.5px;
      font-weight: 600;
      color: var(--foreground);
      line-height: 1.4;
    }
    .aui-dialog-close {
      width: 28px;
      height: 28px;
      flex: none;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-foreground);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
      transition: background-color var(--aui-color), color var(--aui-color), transform var(--aui-spring-press);
    }
    .aui-dialog-close:hover {
      background: var(--muted);
      color: var(--foreground);
    }
    .aui-dialog-close:active { transform: scale(var(--aui-scale-press)); }
    .aui-dialog-close svg { width: 15px; height: 15px; display: block; }
    .aui-dialog-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 20px;
    }
    .aui-dialog-footer {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      background: var(--muted);
    }
    .aui-btn-spinner {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1.8px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      display: inline-block;
      margin-right: 6px;
      animation: bw-rot 0.75s linear infinite;
    }

    /* 8. Animate UI Reka Drawer (swipe-to-dismiss + scrubbed backdrop) */
    .aui-drawer-overlay {
      position: fixed;
      inset: 0;
      z-index: 990;
      background: rgba(2, 6, 23, 0.44);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }
    .aui-drawer-content {
      position: fixed;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      background: var(--card);
      color: var(--foreground);
      box-shadow: -12px 0 40px rgba(2, 6, 23, 0.22);
      outline: none;
    }
    .aui-drawer-right {
      top: 0;
      right: 0;
      bottom: 0;
      border-left: 1px solid var(--border);
    }
    .aui-drawer-left {
      top: 0;
      left: 0;
      bottom: 0;
      border-right: 1px solid var(--border);
      box-shadow: 12px 0 40px rgba(2, 6, 23, 0.22);
    }
    .aui-drawer-handle {
      position: absolute;
      left: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 36px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--muted-foreground) 32%, transparent);
      cursor: grab;
      z-index: 4;
      transition: background-color var(--aui-color);
    }
    .aui-drawer-handle:hover {
      background: color-mix(in srgb, var(--primary) 65%, transparent);
    }
    .aui-drawer-header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 18px 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .aui-drawer-head-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .aui-drawer-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .aui-drawer-extra {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .aui-drawer-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
    }
    .aui-drawer-content.doc-drawer .pdf-viewport {
      flex: 1;
      min-height: 0;
      min-width: 0;
      max-height: none;
    }
    .aui-drawer-content.doc-drawer .doc-spin,
    .aui-drawer-content.doc-drawer .ant-spin-nested-loading,
    .aui-drawer-content.doc-drawer .ant-spin-container {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .aui-drawer-content.doc-drawer .docbody {
      max-height: none;
      height: 100%;
      min-height: 0;
    }

    /* 9. Animate UI Reka Switch (spring thumb + press stretch) */
    .aui-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 40px;
      height: 22px;
      padding: 2px;
      border: 0;
      border-radius: 999px;
      background: #cbd5e1;
      cursor: pointer;
      flex: none;
      box-sizing: border-box;
      transition: background-color var(--aui-color);
    }
    html[data-theme="dark"] .aui-switch {
      background: #334155;
    }
    .aui-switch[data-state="checked"] {
      background: var(--primary);
    }
    .aui-switch:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .aui-switch-thumb {
      display: block;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
      pointer-events: none;
    }
    .aui-switch[data-state="checked"] .aui-switch-thumb {
      margin-left: auto;
    }
    .aui-switch.is-sm {
      width: 30px;
      height: 17px;
      padding: 2px;
    }
    .aui-switch.is-sm .aui-switch-thumb {
      width: 13px;
      height: 13px;
    }
    .aui-switch.is-xs {
      width: 26px;
      height: 15px;
      padding: 2px;
    }
    .aui-switch.is-xs .aui-switch-thumb {
      width: 11px;
      height: 11px;
    }

    /* 10. Animate UI Reka Accordion */
    .aui-acc-root {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .aui-acc-trigger {
      width: 100%;
      border: 0;
      background: var(--muted);
      color: var(--foreground);
      padding: 6px 10px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color var(--aui-color);
    }
    .aui-acc-trigger[data-state="open"] .bt-acc-chev {
      transform: rotate(90deg);
    }
    .aui-acc-header {
      margin: 0;
    }

    /* 11. Animate UI Reka DropdownMenu (gliding highlight + stagger rows) */
    .aui-dropdown-content {
      z-index: 1500;
      min-width: 148px;
      padding: 5px;
      border-radius: 10px;
      background: var(--card);
      color: var(--foreground);
      border: 1px solid var(--border);
      box-shadow: 0 12px 36px rgba(15, 23, 42, 0.16);
      outline: none;
    }
    html[data-theme="dark"] .aui-dropdown-content {
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.48);
    }
    .aui-dd-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--foreground);
      cursor: pointer;
      user-select: none;
      outline: none;
    }
    .aui-dd-item[data-highlighted] {
      background: var(--muted);
      color: var(--foreground);
    }
    .aui-dd-item.is-active {
      color: var(--primary);
      font-weight: 600;
    }
    .aui-dd-item.is-danger {
      color: var(--destructive);
    }
    .aui-dd-item.is-danger[data-highlighted] {
      background: rgba(239, 68, 68, 0.1);
      color: var(--destructive);
    }
    .aui-dd-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 6px;
    }

    /* 12. Animate UI Top-Center Status Capsule (Dynamic Island / Linear / Vercel pill) */
    .aui-toast-viewport {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2500;
      width: min(440px, calc(100vw - 32px));
      height: 0;
      overflow: visible;
      outline: none;
      pointer-events: none;
    }
    .aui-toast-root {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: max-content;
      max-width: 100%;
