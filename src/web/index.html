<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O2</title>
  <link rel="stylesheet" href="/vendor/reset.css" />
  <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
  <style>
    :root {
      --background: #fafafa;
      --foreground: #020617;
      --card: #fafafa;
      --muted: #f5f5f5;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --input: #e2e8f0;
      --primary: #1d4ed8;
      --primary-foreground: #eff6ff;
      --secondary: #f5f5f5;
      --secondary-foreground: #0f172a;
      --accent: #f5f5f5;
      --accent-foreground: #0f172a;
      --destructive: #e7000b;
      --ring: #3b82f6;
      --sidebar: #fafafa;
      --sidebar-foreground: #09090b;
      --sidebar-accent: #f4f4f4;
      --sidebar-accent-foreground: #18181b;
      --sidebar-border: #e4e4e7;
      --sidebar-primary: #18181b;
      --hit: #facc15;
      --ok: #16a34a;
      --radius: 6px;
      --radius-card: 8px;
      --sidebar-w: 256px;
      --topbar-h: 56px;
      --pad: 32px;
      --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Inter,
              "Source Han Sans SC", -apple-system, "Segoe UI", sans-serif;
    }
    html, body, #app { height: 100%; overflow: hidden; }
    #app > * { height: 100%; }
    html, body { background: var(--background); color: var(--foreground); }
    body {
      font-family: var(--font);
      margin: 0;
    }

    .shell { display: flex; height: 100%; min-width: 0; }
    .sider {
      width: var(--sidebar-w); flex: none;
      background: var(--sidebar); color: var(--sidebar-foreground);
      border-right: 1px solid var(--sidebar-border);
      display: flex; flex-direction: column;
      padding: 12px 10px;
    }
    .nav { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
    .nav-switch {
      position: relative; display: flex; flex-direction: column; gap: 8px;
    }
    .slide-pill {
      position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none;
      border-radius: var(--radius); background: #1e3a8a;
      transition: transform .34s cubic-bezier(.22, .8, .28, 1), width .34s cubic-bezier(.22, .8, .28, 1), height .34s cubic-bezier(.22, .8, .28, 1), opacity .2s;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      border: 0; background: transparent; color: var(--sidebar-foreground);
      text-align: left; padding: 12px 14px; min-height: 44px;
      border-radius: var(--radius);
      cursor: pointer; font-size: 14px; line-height: 1.4;
      flex: none;
    }
    .nav-switch .slide-pill { background: #dbeafe; }
    .nav-switch .nav-item { position: relative; z-index: 1; }
    .nav-switch .nav-item.on,
    .nav-switch .nav-item.on:hover {
      background: transparent; color: #1e3a8a; font-weight: 500;
    }
    .nav-history { display: none; }
    .sider.sider-hist { padding: 8px 8px 0; }
    .hist-manage-pane {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .hist-manage-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 4px 8px 8px;
    }
    .hist-manage-title {
      font-size: 16px; font-weight: 600; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hist {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      margin-top: 4px; padding-top: 8px;
      border-top: 1px solid var(--sidebar-border);
    }
    .hist-head {
      flex: none; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 0 6px 6px 14px;
    }
    .hist-head-label { font-size: 12px; color: var(--muted-foreground); font-weight: 500; line-height: 1.4; }
    .hist-head-actions { display: flex; align-items: center; gap: 4px; }
    .hist-tool, .hist-manage {
      border: 0; background: transparent; color: var(--muted-foreground);
      cursor: pointer; border-radius: var(--radius);
    }
    .hist-tool {
      width: 28px; height: 28px; display: grid; place-items: center; padding: 0;
    }
    .hist-tool .nav-ico { width: 15px; height: 15px; }
    .hist-manage { font-size: 12px; padding: 4px 8px; }
    .hist-tool:hover, .hist-manage:hover { background: var(--sidebar-accent); color: var(--foreground); }
    .hist-manage:disabled { opacity: .4; cursor: default; background: transparent; }
    .hist-scroll {
      flex: 1; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; gap: 2px;
    }
    .hist-empty {
      padding: 6px 14px;
      font-size: 12px; line-height: 1.5;
      color: #94a3b8;
    }
    .hist-label {
      font-size: 12px; color: var(--muted-foreground);
      padding: 10px 14px 2px;
    }
    .hist-item {
      display: flex; align-items: center; gap: 6px; width: 100%;
      border: 0; background: transparent; color: var(--sidebar-foreground);
      text-align: left; padding: 8px 14px; min-height: 36px;
      border-radius: var(--radius); cursor: pointer; font-size: 13px;
    }
    .hist-item:hover, .hist-item.on { background: var(--sidebar-accent); }
    .hist-item.on { font-weight: 500; }
    .hist-title, .hist-pick-title {
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .hist-pin { width: 12px; height: 12px; flex: none; color: var(--muted-foreground); display: grid; place-items: center; }
    .hist-pin svg { width: 12px; height: 12px; }
    .matrix-loader {
      width: 1em; height: 1em; flex: none; display: block; pointer-events: none;
    }
    .hist-close {
      width: 32px; height: 32px; border: 0; background: transparent; border-radius: 50%;
      display: grid; place-items: center; cursor: pointer; color: var(--muted-foreground);
    }
    .hist-close:hover { background: var(--sidebar-accent); color: var(--foreground); }
    .hist-close svg { width: 16px; height: 16px; }
    .hist-group { margin-bottom: 4px; }
    .hist-pick {
      display: flex; align-items: center; gap: 12px; width: 100%;
      border: 0; background: transparent; text-align: left;
      padding: 12px; border-radius: 8px; cursor: pointer;
      font-size: 15px; color: var(--foreground);
    }
    .hist-pick:hover, .hist-pick.on { background: #f4f4f5; }
    .hist-pick .ant-checkbox-wrapper,
    .hist-pick .ant-checkbox { pointer-events: none; }
    .hist-pick .ant-checkbox-inner { border-radius: 50%; width: 18px; height: 18px; }
    .hist-pick .ant-checkbox-checked .ant-checkbox-inner {
      background: var(--primary); border-color: var(--primary);
    }
    .hist-foot { display: flex; align-items: stretch; min-height: 52px; }
    .hist-foot .ant-btn {
      flex: 1; height: 52px; border-radius: 0; font-size: 15px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      box-shadow: none;
    }
    .hist-foot .icon-svg, .hist-foot svg { width: 16px; height: 16px; }
    .hist-manage-pane .hist-scroll { padding: 0 4px 8px; }
    .hist-manage-pane .hist-label { padding: 10px 12px 2px; }
    .hist-manage-pane .hist-foot { border-top: 1px solid var(--border); }
    .nav-item:hover { background: var(--sidebar-accent); }
    .nav-item.on {
      background: var(--sidebar-accent);
      color: var(--sidebar-accent-foreground);
      font-weight: 500;
    }
    .nav-ico { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
    .nav-ico svg { width: 16px; height: 16px; }

    .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--background); }
    .topbar {
      height: var(--topbar-h); flex: none;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 0 var(--pad);
      background: var(--card); border-bottom: 1px solid var(--border);
    }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .settings-save-hint { font-size: 13px; color: var(--muted-foreground); }
    .icon-btn {
      width: 32px !important; height: 32px !important; min-width: 32px !important;
      padding: 0 !important; overflow: hidden !important; line-height: 0 !important;
      display: inline-flex !important; align-items: center; justify-content: center;
    }
    .icon-btn > span,
    .icon-btn .icon-svg,
    .icon-btn .ant-btn-loading-icon {
      display: inline-flex !important; align-items: center; justify-content: center;
      line-height: 0 !important; margin: 0 !important; transform: none !important;
    }
    .icon-btn .icon-svg,
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .icon-btn .ant-btn-loading-icon .anticon { margin: 0 !important; }

    .content { flex: 1; min-height: 0; overflow: auto; padding: var(--pad); }
    .content.pane-ask { padding: 0; display: flex; overflow: hidden; }
    .content.pane-browser { padding: 0; display: flex; overflow: hidden; }
    .content.pane-settings { padding: 0; display: flex; overflow: hidden; }
    .content.pane-catalog {
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pane-stage { min-width: 0; }
    .content.pane-ask > .pane-stage,
    .content.pane-browser > .pane-stage,
    .content.pane-settings > .pane-stage,
    .content.pane-catalog > .pane-stage {
      flex: 1; min-height: 0; height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .content.switching .hero,
    .content.switching .hit,
    .content.switching .chat-empty,
    .content.switching .msg:nth-last-child(-n+4),
    .content.switching .filters,
    .content.switching .cat-tree-pane,
    .content.switching .cat-toolbar,
    .content.switching .type-capsules,
    .content.switching .table-card,
    .content.switching .settings-card,
    .docbody.switching .chunk,
    .settings-body.switching .settings-card {
      animation: block-fade .46s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes block-fade {
      from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .pane-catalog .filters.mb { flex: none; }
    .pane-catalog .table-card {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .pane-catalog .table-card .ant-table-wrapper,
    .pane-catalog .table-card .ant-spin-nested-loading,
    .pane-catalog .table-card .ant-spin-container {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
    }
    .pane-catalog .table-card .ant-spin-container > .ant-table {
      flex: 1; min-height: 0; overflow: hidden;
    }

    .hero { display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px; }
    .hero h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
    .lead { margin: 0; color: var(--muted-foreground); font-size: 14px; line-height: 1.7; }
    .search-row { display: flex; align-items: center; gap: 12px; }
    .search-row .ant-input-affix-wrapper,
    .search-row > .ant-input { flex: 1; min-width: 0; height: 40px; }
    .search-row .ant-btn { flex: none; height: 40px; }
    .filters { display: flex; align-items: center; gap: 12px; }
    .filters.mb { margin-bottom: 16px; }
    .hint { font-size: 13px; color: var(--muted-foreground); }
    .spacer { flex: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--border); background: var(--card); color: var(--foreground);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
      line-height: 1.3;
    }
    .chip:hover { background: var(--accent); }

    .results { display: flex; flex-direction: column; gap: 8px; }
    .hit {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 16px;
      display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    }
    .hit:hover { background: #f8fafc; border-color: #cbd5e1; }
    .hit-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; font-size: 12px; color: var(--muted-foreground);
    }
    .hit-tags { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .docno { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted-foreground); }
    .loc { font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
    .hit-title { font-size: 15px; font-weight: 600; line-height: 1.4; }
    .hit-body { font-size: 14px; line-height: 1.7; color: var(--muted-foreground); }
    mark { background: #fef08a; color: inherit; padding: 0 1px; border-radius: 2px; }
    .hit-open { font-size: 13px; font-weight: 500; color: var(--primary); width: fit-content; }
    .hit:hover .hit-open { text-decoration: underline; }

    .origin { margin-top: 10px; border: 1px solid var(--border); border-radius: var(--radius);
              background: var(--muted); padding: 8px; }
    .origin img { display: block; width: 100%; height: auto; border-radius: 4px; background: #fff; }
    .hit .origin { max-height: 620px; overflow-y: auto; }
    .drawer-origin { margin-bottom: 0; flex: 1; min-height: 0; min-width: 0; }
    .drawer-origin img { max-width: 100%; }
    .pdf-viewport {
      max-height: calc(100vh - 230px); overflow: auto; padding: 4px;
      cursor: grab; user-select: none; overscroll-behavior: contain;
    }
    .doc-drawer .ant-drawer-wrapper-body { height: 100%; display: flex; flex-direction: column; }
    .doc-drawer .ant-drawer-header { flex: none; }
    .doc-drawer .ant-drawer-title {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .doc-drawer .pdf-viewport {
      flex: 1; min-height: 0; min-width: 0; max-height: none;
    }
    .doc-drawer .doc-spin,
    .doc-drawer .ant-spin-nested-loading,
    .doc-drawer .ant-spin-container {
      flex: 1; min-height: 0; min-width: 0;
      display: flex; flex-direction: column;
    }
    .doc-drawer .docbody { max-height: none; height: 100%; min-height: 0; }
    .pdf-viewport.is-panning { cursor: grabbing; }
    .pdf-stage { margin: 0 auto; }
    .page-wrap { margin: 0 0 14px; position: relative; }
    .page-frame { position: relative; }
    .page-skel {
      width: 100%; aspect-ratio: 210 / 297;
      border-radius: 3px; background: #e8eef4; overflow: hidden;
      position: relative;
    }
    .page-skel.is-shimmer::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(
        100deg,
        transparent 0%,
        rgba(255, 255, 255, .15) 36%,
        rgba(255, 255, 255, .85) 50%,
        rgba(255, 255, 255, .15) 64%,
        transparent 100%
      );
      transform: translateX(-100%);
      animation: skel-shimmer 1.25s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    @keyframes skel-shimmer {
      100% { transform: translateX(100%); }
    }
    .page-wrap img {
      display: block; width: 100%; background: #fff; border-radius: 3px;
      pointer-events: none; -webkit-user-drag: none;
    }
    .page-frame:not(.ready) img {
      position: absolute; left: 0; top: 0; height: 1px; opacity: 0;
    }
    .pageimg.is-in { animation: page-in .22s ease both; }
    @keyframes page-in { from { opacity: 0; } to { opacity: 1; } }
    .pdf-zoombar {
      display: inline-flex; align-items: center; flex: none;
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
    }
    .pdf-zoom-btn, .pdf-zoom-now {
      border: 0; background: var(--card); color: var(--foreground);
      height: 28px; cursor: pointer; line-height: 28px; padding: 0;
    }
    .pdf-zoom-btn { width: 28px; font-size: 16px; }
    .pdf-zoom-btn:disabled { opacity: 0.35; cursor: default; }
    .pdf-zoom-now {
      min-width: 76px; padding: 0 8px; font-size: 12px;
      border-left: 1px solid var(--border); border-right: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }
    .pdf-zoom-btn:hover:not(:disabled),
    .pdf-zoom-now:hover { background: var(--accent); }
    .page-wrap img.page-hit { outline: 2px solid var(--hit); }
    .page-no { text-align: center; font-size: 12px; color: var(--muted-foreground); padding-top: 4px; pointer-events: none; }

    .docview-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
      margin: 0 0 12px; flex: none; min-width: 0;
    }
    .doc-drawer .docmeta { flex: none; min-width: 0; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .seg-item { padding: 6px 12px; cursor: pointer; background: var(--card); color: var(--muted-foreground); font-size: 13px; }
    .seg-item + .seg-item { border-left: 1px solid var(--border); }
    .seg-item.on { background: var(--secondary); color: var(--foreground); font-weight: 500; }
    .pager { font-size: 13px; color: var(--primary); cursor: pointer; }
    .pager:hover { text-decoration: underline; }
    .pager-num { font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
    .img-fail { padding: 18px; text-align: center; font-size: 13px; color: var(--muted-foreground); }
    .img-fail a { color: var(--primary); cursor: pointer; }

    .chatwrap {
      position: relative;
      display: flex; flex-direction: column; height: 100%; width: 100%;
      min-height: 0; min-width: 0; background: var(--background);
    }
    .chatlog {
      flex: 1; overflow-y: auto; padding: var(--pad); padding-bottom: 168px;
      transition: padding .34s cubic-bezier(.22, 1, .36, 1);
      mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        rgba(0, 0, 0, .26) 14px,
        rgba(0, 0, 0, .76) 32px,
        #000 50px,
        #000 calc(100% - 26px),
        transparent 100%
      );
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0px,
        rgba(0, 0, 0, .26) 14px,
        rgba(0, 0, 0, .76) 32px,
        #000 50px,
        #000 calc(100% - 26px),
        transparent 100%
      );
    }
    .chat-empty {
      width: min(640px, 100%); margin: 24px auto 0; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius-card); padding: 32px;
      display: flex; flex-direction: column; gap: 16px;
      transition:
        margin .34s cubic-bezier(.22, 1, .36, 1),
        padding .34s cubic-bezier(.22, 1, .36, 1),
        gap .34s cubic-bezier(.22, 1, .36, 1),
        transform .34s cubic-bezier(.22, 1, .36, 1);
    }
    .chat-empty h2 {
      margin: 0; font-size: 20px; font-weight: 600;
      transition: font-size .34s cubic-bezier(.22, 1, .36, 1);
    }
    .chat-empty p {
      margin: 0; color: var(--muted-foreground); font-size: 14px; line-height: 1.7;
      transition: font-size .34s cubic-bezier(.22, 1, .36, 1), line-height .34s cubic-bezier(.22, 1, .36, 1);
    }
    .ask-chips {
      display: flex; flex-direction: column; gap: 8px;
      transition: gap .34s cubic-bezier(.22, 1, .36, 1);
    }
    .ask-chip {
      width: 100%; text-align: left; border: 1px solid var(--border);
      background: var(--background); color: var(--foreground);
      border-radius: var(--radius); padding: 10px 12px; font-size: 14px; cursor: pointer;
      transition: padding .34s cubic-bezier(.22, 1, .36, 1), font-size .34s cubic-bezier(.22, 1, .36, 1), background .15s ease;
    }
    .ask-chip:hover { background: var(--accent); }
    .msg { display: flex; margin-bottom: 14px; max-width: 860px; margin-left: auto; margin-right: auto; }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble {
      background: var(--primary); color: var(--primary-foreground); max-width: 76%;
      border-radius: 10px 10px 2px 10px;
    }
    .msg.assistant .bubble {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px 10px 10px 2px; max-width: 100%; width: 100%;
    }
    .bubble { padding: 12px 16px; font-size: 14px; line-height: 1.85; }
    .msg.user .bubble { line-height: 1.7; }

    .tools {
      margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px dashed var(--border);
    }
    .sbf-window {
      overflow: hidden;
      mask-image: linear-gradient(to bottom,
        transparent 0%, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom,
        transparent 0%, #000 10%, #000 90%, transparent 100%);
      transition: height .45s cubic-bezier(.22, 1, .36, 1);
    }
    .sbf-track {
      will-change: transform;
      transition: transform .5s cubic-bezier(.22, 1, .36, 1);
    }
    .sbf-item {
      display: flex; align-items: center; gap: 8px;
      height: 24px; font-size: 12px; color: var(--muted-foreground);
      filter: blur(3.2px); opacity: .34;
      transform: scale(.97);
      transform-origin: left center;
      transition:
        filter .45s cubic-bezier(.45, 0, .55, 1),
        opacity .45s cubic-bezier(.45, 0, .55, 1),
        transform .45s cubic-bezier(.45, 0, .55, 1);
    }
    .sbf-item.near {
      filter: blur(1.2px); opacity: .62; transform: scale(.99);
    }
    .sbf-item.on {
      filter: blur(0); opacity: 1; transform: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .sbf-window, .sbf-track, .sbf-item { transition: none; }
      .sbf-item { filter: none; transform: none; }
      .sbf-item.far { display: none; }
      .sbf-item.near { opacity: .4; }
    }
    .tool-dot { width: 6px; height: 6px; border-radius: 1.5px; background: #cbd5e1; flex: none; }
    .tool-dot.running { background: var(--hit); animation: pulse 1s infinite; }
    .tool-dot.none { background: var(--destructive); }
    .tool-dot.few { background: var(--hit); }
    .tool-dot.ok { background: var(--ok); }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    .tool-q { color: var(--foreground); }
